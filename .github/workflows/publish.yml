name: Publish npm package

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "release tag $RELEASE_TAG does not match package version v$package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install verified shfmt
        run: node src/cli.mjs setup

      - name: Publish
        run: npm publish --access public --provenance
        env:
          # Required only for the first bootstrap publish. Remove the repository
          # secret after configuring npm Trusted Publishing for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
